name: SideStore SwiftUI Preview Build

on:
  push:
    branches: [feature/swiftui-rewrite]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sidestore-swiftui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SideStore preview (no release publishing)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - run: brew install ldid xcbeautify

      - name: Setup preview version
        run: |
          MARKETING_VERSION=$(python3 scripts/ci/workflow.py get-marketing-version)
          SHORT_COMMIT=$(git rev-parse --short HEAD)
          NORMALIZED_VERSION="${MARKETING_VERSION}-swiftui.${SHORT_COMMIT}"
          python3 scripts/ci/workflow.py set-marketing-version "$NORMALIZED_VERSION"
          echo "SHORT_COMMIT=$SHORT_COMMIT" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$NORMALIZED_VERSION" >> "$GITHUB_ENV"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"

      - name: Restore Cache
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-swiftui-preview-${{ github.sha }}
          restore-keys: |
            xcode-build-cache-LiveContainerSupport-
            xcode-build-cache-

      - name: Build standalone SideStore IPA
        env:
          BUILD_LOG_ZIP_PASSWORD: ${{ secrets.BUILD_LOG_ZIP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 scripts/ci/workflow.py build
          python3 scripts/ci/workflow.py encrypt-build
          mv SideStore.ipa "SideStore-${MARKETING_VERSION}.ipa"

      - name: Save Cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-build-cache-swiftui-preview-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-SwiftUI-Preview-${{ env.MARKETING_VERSION }}.ipa
          path: SideStore-${{ env.MARKETING_VERSION }}.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-SwiftUI-Preview-Logs-${{ env.SHORT_COMMIT }}.zip
          path: build-logs.zip
          if-no-files-found: error

      - name: Publish versioned SideStore integration preview (never nightly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="swiftui-preview-${SHORT_COMMIT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "SideStore-${MARKETING_VERSION}.ipa#SideStore.ipa" --clobber
          else
            gh release create "$TAG" "SideStore-${MARKETING_VERSION}.ipa#SideStore.ipa" \
              --target "$GITHUB_SHA" \
              --title "SideStore SwiftUI Preview ${SHORT_COMMIT}" \
              --notes "Non-production integration preview built from commit $GITHUB_SHA on branch feature/swiftui-rewrite. This release is separate from nightly." \
              --prerelease
          fi
          echo "Created or updated preview release: $TAG"
          echo "SideStore preview asset: https://github.com/cicada4ever/SideStore/releases/download/$TAG/SideStore.ipa"
